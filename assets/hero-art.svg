<svg viewBox="0 0 720 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Noite e ondas do sono">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1216"/>
      <stop offset=".55" stop-color="#4c0715"/>
      <stop offset="1" stop-color="#6c0c1f"/>
    </linearGradient>
    <radialGradient id="moon" cx=".35" cy=".35" r=".8">
      <stop offset="0" stop-color="#f6e7ea"/>
      <stop offset="1" stop-color="#e7b9c2"/>
    </radialGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2596b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#e7b9c2"/>
      <stop offset="1" stop-color="#c2596b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="900" fill="url(#sky)"/>
  <!-- crescent moon -->
  <g transform="translate(500 190)">
    <circle r="120" fill="url(#moon)"/>
    <circle r="120" cx="-58" fill="#4c0715"/>
  </g>
  <!-- stars -->
  <g fill="#f6e7ea">
    <circle cx="120" cy="120" r="2.5" opacity=".8"/>
    <circle cx="220" cy="80" r="1.6" opacity=".6"/>
    <circle cx="80" cy="260" r="1.8" opacity=".5"/>
    <circle cx="330" cy="150" r="1.4" opacity=".5"/>
    <circle cx="620" cy="360" r="2" opacity=".6"/>
    <circle cx="180" cy="360" r="1.4" opacity=".4"/>
    <circle cx="420" cy="70" r="1.6" opacity=".5"/>
  </g>
  <!-- sleep / polysomnography waves -->
  <g fill="none" stroke="url(#wave)" stroke-width="2.5" opacity=".9">
    <path d="M0 560 q60 -40 120 0 t120 0 t120 0 t120 0 t120 0 t120 0"/>
    <path d="M0 620 q80 -60 160 0 t160 0 t160 0 t160 0 t160 0" opacity=".7"/>
    <path d="M0 690 q40 -50 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0" opacity=".55"/>
    <path d="M0 760 q100 -30 200 0 t200 0 t200 0 t200 0" opacity=".4"/>
  </g>
  <!-- soft horizon glow -->
  <ellipse cx="360" cy="900" rx="520" ry="200" fill="#8a1027" opacity=".5"/>
</svg>
